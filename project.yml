name: ShakeCheer
options:
  bundleIdPrefix: com.marion345
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.marion345.shakecheer
    SWIFT_VERSION: 5.0
targets:
  ShakeCheer:
    type: application
    platform: iOS
    sources:
      - path: ShakeCheer
      - path: Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ShakeCheer/Info.plist
      properties:
        CFBundleDisplayName: ShakeCheer
        NSMotionUsageDescription: ShakeCheer utilise les capteurs de mouvement pour déclencher les sons lorsque vous secouez votre iPhone.
        UIApplicationSupportsIndirectInputEvents: true

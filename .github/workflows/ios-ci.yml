name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/shake-cheer-v0.1

jobs:
  build:
    name: Build ShakeCheer
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate original familiar audio
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 scripts/generate_familiar_audio.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ShakeCheer.xcodeproj \
            -scheme ShakeCheer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

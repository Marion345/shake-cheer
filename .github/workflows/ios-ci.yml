name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/shake-cheer-v0.1

jobs:
  build:
    name: Build ShakeCheer
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install build tools
        run: |
          brew install xcodegen
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 -m pip install --break-system-packages --upgrade yt-dlp

      - name: Install user-selected audio
        run: python3 scripts/install_user_audio.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ShakeCheer.xcodeproj \
            -scheme ShakeCheer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
